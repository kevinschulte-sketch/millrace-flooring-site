<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Millrace — Business Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@600;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--gs-green:#5DBB51;--gs-blue:#36499C;--pop:#FF6B35;--ink:#111528;--tint:#F2F6EF;--line:rgba(17,21,40,0.12);}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .lock{width:min(420px,90vw);background:#fff;border-radius:18px;padding:40px 36px;text-align:center;}
  .chips{display:flex;justify-content:center;margin-bottom:18px;}
  .chip{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Exo',sans-serif;font-weight:700;font-size:14px;color:#fff;}
  .chip.gs{background:linear-gradient(135deg,var(--gs-blue),var(--gs-green));}
  .chip.mr{background:var(--pop);margin-left:-9px;border:3px solid #fff;}
  h1{font-family:'Exo',sans-serif;font-weight:700;font-size:24px;color:var(--ink);margin:0 0 6px;}
  h1 .accent{color:var(--gs-green);}
  p{font-size:13px;color:#4B5170;line-height:1.55;margin:0 0 22px;}
  input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-family:'IBM Plex Mono',monospace;font-size:14px;background:var(--tint);color:var(--ink);text-align:center;}
  input:focus{outline:2px solid var(--gs-green);border-color:var(--gs-green);}
  button{width:100%;margin-top:12px;padding:12px;border:none;border-radius:10px;background:var(--pop);color:#fff;font-family:'Exo',sans-serif;font-weight:600;font-size:15px;cursor:pointer;}
  button:hover{background:#C64A1F;}
  .err{color:#C0392B;font-size:12.5px;min-height:16px;margin-top:12px;font-weight:500;}
  .foot{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#9DA4C4;margin-top:20px;line-height:1.6;}
</style>
</head>
<body>

const SKEY='millrace_site_pw';
function b64(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }
async function tryUnlock(pw){
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(SALT), iterations:ITER, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(IV)}, key, b64(CT));
  return new TextDecoder().decode(pt);
}
async function unlock(pw, silent){
  if(!(window.crypto && crypto.subtle)){
    document.getElementById('err').textContent = 'This page needs a secure connection (https) to decrypt — open the published link, not a local file.';
    return;
  }
  try{
    const html = await tryUnlock(pw);
    try{ sessionStorage.setItem(SKEY, pw); }catch(e){}
    document.open(); document.write(html); document.close();
  }catch(e){
    if(!silent) document.getElementById('err').textContent = 'That password didn\'t work — check with Kevin and try again.';
  }
}
document.getElementById('f').addEventListener('submit', ev=>{
  ev.preventDefault();
  unlock(document.getElementById('pw').value, false);
});
(function(){
  let saved = null;
  try{ saved = sessionStorage.getItem(SKEY); }catch(e){}
  if(saved) unlock(saved, true);
})();
